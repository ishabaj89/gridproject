<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Color Palette</title>
    <link rel="stylesheet" href="style/index.css">
</head>

<body>

    <main class="grid-container">

        <!-- Top left: two teal boxes -->
        <div class="top-left">
            <div class="box teal"></div>
            <div class="box teal"></div>
        </div>

        <!-- Top middle: green box -->
        <div class="top-middle green"></div>

        <!-- Top right: three yellow boxes -->
        <div class="top-right">
            <div class="box yellow-one"></div>
            <div class="box yellow-two"></div>
            <div class="box yellow-three"></div>
        </div>

        <!-- Bottom left: green box -->
        <div class="bottom-left green-light"></div>

        <!-- Bottom middle: two yellow-green boxes -->
        <div class="bottom-middle">
            <div class="box yellow-four"></div>
            <div class="box yellow-five"></div>
        </div>

        <!-- Bottom middle-right: olive box -->
        <div class="bottom-wide olive"></div>

        <!-- Bottom right: teal box -->
        <div class="bottom-right teal"></div>

    </main>

    <section class="title-bar">
        <h1>MY COLOR PALETTE</h1>
    </section>

</body>

</html>
